{% extends "base.html" %}
{% block content %}
<div class="card" style="margin-top:30px;">
  <h1>Create New Account</h1>
  <form method="POST">
    <label for="name">Full Name</label>
    <input type="text" id="name" name="name" placeholder="e.g. Saanvi Sharma" required />

    <label for="balance">Opening Balance ($)</label>
    <input type="number" id="balance" name="balance" placeholder="e.g. 500" min="0" step="0.01" required />

    <button type="submit">Create Account</button>
    <a class="btn btn-outline" href="/" style="margin-left:10px;">Cancel</a>
  </form>
</div>
{% endblock %}
