<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astro Bank</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: Arial, sans-serif;
        background: #f0f4f8;
        color: #333;
      }
      nav {
        background: #1a73e8;
        padding: 14px 24px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      nav a {
        color: white;
        text-decoration: none;
        font-size: 15px;
      }
      nav .brand {
        font-size: 18px;
        font-weight: bold;
      }
      .container {
        max-width: 700px;
        margin: 40px auto;
        padding: 0 16px;
      }
      .card {
        background: white;
        border-radius: 10px;
        padding: 28px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      }
      h1 {
        margin-bottom: 20px;
        font-size: 22px;
      }
      h2 {
        margin-bottom: 16px;
        font-size: 18px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-size: 14px;
        font-weight: bold;
      }
      input {
        width: 100%;
        padding: 9px 12px;
        border: 1px solid #ccc;
        border-radius: 6px;
        font-size: 14px;
        margin-bottom: 14px;
      }
      button,
      .btn {
        background: #1a73e8;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 14px;
        text-decoration: none;
        display: inline-block;
      }
      button:hover,
      .btn:hover {
        background: #1558b0;
      }
      .btn-outline {
        background: white;
        color: #1a73e8;
        border: 1px solid #1a73e8;
      }
      .btn-outline:hover {
        background: #e8f0fe;
      }
      .alert {
        padding: 10px 14px;
        border-radius: 6px;
        margin-bottom: 16px;
        font-size: 14px;
      }
      .alert.success {
        background: #d4edda;
        color: #155724;
      }
      .alert.error {
        background: #f8d7da;
        color: #721c24;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        text-align: left;
        padding: 10px 12px;
        border-bottom: 1px solid #eee;
        font-size: 14px;
      }
      th {
        background: #f5f5f5;
        font-weight: bold;
      }
      tr:hover td {
        background: #fafafa;
      }
      .row {
        display: flex;
        gap: 12px;
      }
      .row input {
        flex: 1;
      }
      .balance {
        font-size: 28px;
        font-weight: bold;
        color: #1a73e8;
        margin: 8px 0 20px;
      }
      .section {
        margin-top: 24px;
        padding-top: 20px;
        border-top: 1px solid #eee;
      }
    </style>
  </head>
  <body>
    <nav>
      <a class="brand" href="/">Astro Bank</a>
      <a href="/">Home</a>
      <a href="/create">New Account</a>
    </nav>
    <div class="container">
      {% with messages = get_flashed_messages(with_categories=true) %} {% for
      category, message in messages %}
      <div class="alert {{ category }}" style="margin-top: 20px">
        {{ message }}
      </div>
      {% endfor %} {% endwith %} {% block content %}{% endblock %}
    </div>
  </body>
</html>
